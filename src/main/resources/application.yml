spring:
  application:
    name: qsoft-ai-governance

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qsoft_governance}
    username: ${DB_USER:qsoft}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# OpenAPI/Swagger: habilitado por padrão (dev). Em produção, defina
# OPENAPI_ENABLED=false para não expor a superfície da API.
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}

app:
  bootstrap:
    # Seed de demonstração (tenant + admin) DESABILITADO por padrão.
    # Para habilitar localmente: APP_BOOTSTRAP_DEMO_DATA=true e
    # APP_BOOTSTRAP_DEMO_PASSWORD=<senha forte>.
    demo-data: false
  security:
    jwt:
      # Segredo HMAC para assinatura/validação do JWT (ADR-30).
      # OBRIGATÓRIO: defina a variável de ambiente JWT_SECRET (mínimo 32 chars).
      # Sem valor, a aplicação falha no boot (não há default inseguro).
      secret: ${JWT_SECRET:}
      ttl-minutes: 30
