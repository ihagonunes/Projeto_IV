spring:
  application:
    name: qsoft-ai-governance

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qsoft_governance}
    username: ${DB_USER:qsoft}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  bootstrap:
    # Cria dados de demonstração (tenant qsoft + admin) na inicialização.
    # Desative em ambientes que não devam receber dados demo.
    demo-data: true
  security:
    jwt:
      # Segredo HMAC para assinatura/validação do JWT (ADR-30).
      # Valor abaixo é apenas para DESENVOLVIMENTO LOCAL. Em produção,
      # sobrescreva via variável de ambiente JWT_SECRET.
      secret: ${JWT_SECRET:f4e3d2c1b0a0987612ab2384c5de6f70a1b2c3d4e5f60718293a4b5c6d7e8f90}
      ttl-minutes: 30
