<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto IV</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Importando a fonte Poppins do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Caminhos relativos: voltando duas pastas (../../) para chegar na raiz de 'static' e depois descendo para 'css' -->
    <link href="../../css/base/variables.css" rel="stylesheet">
    <link href="../../css/base/bootstrap-overrides.css" rel="stylesheet">
    <link href="../../css/components/auth-card.css" rel="stylesheet">
    <link href="../../css/components/form-fields.css" rel="stylesheet">
    <link href="../../css/components/buttons.css" rel="stylesheet">
    <link href="../../css/pages/login.css" rel="stylesheet">
</head>

<!-- Adicionando uma classe no body caso você queira colocar aquele fundo terracota/creme -->

<body class="bg-light auth-bg">

    <!-- Container principal: ocupa 100% da altura da tela (vh-100) e centraliza o conteúdo usando Flexbox -->
    <div class="container d-flex justify-content-center align-items-center vh-100">

        <!-- O Card circular/arredondado do seu protótipo (Figma) -->
        <!-- O "col-12 col-md-6 col-lg-4" atua como o limitador de largura! -->

        <!-- auth-card será a classe onde você fará a mágica do círculo e sombras -->
        <div class="auth-card text-center p-1 bg-white">
            <div class="auth-card text-center p-1 bg-white">
                <div class="auth-card text-center p-1 bg-white">

                    <h1 class="mb-4 text-dark fw-light">Bem-Vindo</h1>

                    <form id="loginForm" action="#" method="POST" novalidate>

                        <!-- Campo E-mail -->
                        <div class="mb-3">
                            <input type="email" class="form-control custom-input" id="email" placeholder="e-mail"
                                required>
                            <!-- Sua nova mensagem de erro customizada -->
                            <div class="invalid-feedback text-center mt-2">
                                Ei, você esqueceu de preencher o e-mail!
                            </div>
                        </div>

                        <!-- Campo Senha -->
                        <div class="mb-3">
                            <input type="password" class="form-control custom-input" id="senha" placeholder="senha"
                                required>
                            <div class="invalid-feedback text-center mt-2">
                                Ei, você esqueceu de preencher a senha!
                            </div>
                        </div>

                        <!-- Link Esqueci a Senha -->
                        <div class="mb-4">
                            <!-- Substitua o href pelo caminho correto da rota que criamos no Controller -->
                            <a href="#" id="btnEsqueciSenha" class="text-muted text-decoration-none small">esqueci a
                                senha</a>
                        </div>

                        <!-- Botão de Entrar -->
                        <!-- class btn-orange para o estilo laranja e btn-pill para o arredondamento total -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-orange btn-pill text-white fw-bold">entrar</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- 3. Bootstrap JS (CDN) - Necessário caso use modais, tooltips ou dropdowns -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- 4. Seus arquivos JS -->
    <script src="../../js/core/api-client.js"></script>
    <script src="../../js/core/auth.js"></script>
    <script src="../../js/pages/login.js"></script>

</body>

</html>
