<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - Listar Departamentos - Projeto IV</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Fonte Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Arquivos CSS de Referência -->
    <link href="../../../css/base/variables.css" rel="stylesheet">
    <link href="../../../css/base/bootstrap-overrides.css" rel="stylesheet">
    <link href="../../../css/components/onboarding-card.css" rel="stylesheet">
    <link href="../../../css/components/form-fields.css" rel="stylesheet">
    <link href="../../../css/components/buttons.css" rel="stylesheet">
    <link href="../../../css/components/wizard-tabs.css" rel="stylesheet">
    <link href="../../../css/components/data-grid.css" rel="stylesheet">
    <link href="../../../css/pages/onboarding.css" rel="stylesheet">
</head>

<body class="bg-light auth-bg onboarding-bg">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">

        <div class="onboarding-card p-5 bg-white">
            
            <!-- Menu de Passos (Stepper) -->
            <ul class="wizard-stepper">
                <li class="wizard-step">
                    Tenant
                </li>
                <li class="wizard-step">
                    Administrador Principal
                </li>
                <li class="wizard-step active">
                    Departamentos
                </li>
                <li class="wizard-step">
                    Usuários
                </li>
                <li class="wizard-step">
                    IA
                </li>
                <li class="wizard-step">
                    Revisão
                </li>
            </ul>

            <div class="my-4">
                <h4 class="mb-3 text-dark fw-semibold">Departamentos Cadastrados</h4>
                <div class="data-grid-container">
                    <table class="data-grid">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Líder</th>
                                <th>Orçamento</th>
                                <th>Alerta</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td contenteditable="true">Tecnologia da Informação</td>
                                <td contenteditable="true">João Silva</td>
                                <td contenteditable="true">R$ 50.000,00</td>
                                <td contenteditable="true">80%</td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-secondary me-1 btn-pill">Editar</button>
                                    <button class="btn btn-sm btn-outline-danger btn-pill">Excluir</button>
                                </td>
                            </tr>
                            <tr>
                                <td contenteditable="true">Recursos Humanos</td>
                                <td contenteditable="true">Maria Oliveira</td>
                                <td contenteditable="true">R$ 15.000,00</td>
                                <td contenteditable="true">90%</td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-secondary me-1 btn-pill">Editar</button>
                                    <button class="btn btn-sm btn-outline-danger btn-pill">Excluir</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="d-flex justify-content-between mt-4">
                <a href="step-departamentos-hub.html" class="btn btn-outline-secondary btn-pill">voltar</a>
                <a href="step-usuarios-hub.html" class="btn btn-orange btn-pill text-white fw-bold">próximo</a>
            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
