<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - Cadastro Manual de Usuário - Projeto IV</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Fonte Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Arquivos CSS de Referência -->
    <link href="../../../css/base/variables.css" rel="stylesheet">
    <link href="../../../css/base/bootstrap-overrides.css" rel="stylesheet">
    <link href="../../../css/components/onboarding-card.css" rel="stylesheet">
    <link href="../../../css/components/form-fields.css" rel="stylesheet">
    <link href="../../../css/components/buttons.css" rel="stylesheet">
    <link href="../../../css/components/wizard-tabs.css" rel="stylesheet">
    <link href="../../../css/pages/onboarding.css" rel="stylesheet">
</head>

<body class="bg-light auth-bg onboarding-bg">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">

        <div class="onboarding-card p-5 bg-white">
            
            <!-- Menu de Passos (Stepper) -->
            <ul class="wizard-stepper">
                <li class="wizard-step">
                    Tenant
                </li>
                <li class="wizard-step">
                    Administrador Principal
                </li>
                <li class="wizard-step">
                    Departamentos
                </li>
                <li class="wizard-step active">
                    Usuários
                </li>
                <li class="wizard-step">
                    IA
                </li>
                <li class="wizard-step">
                    Revisão
                </li>
            </ul>

            <form id="usuarioManualForm" action="step-usuarios-hub.html" method="GET" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nomeUsuario" class="form-label-custom">Nome completo *</label>
                        <input type="text" class="form-control custom-input" id="nomeUsuario" required>
                    </div>
                    <div class="col-md-6">
                        <label for="emailUsuario" class="form-label-custom">E-mail corporativo *</label>
                        <input type="email" class="form-control custom-input" id="emailUsuario" placeholder="usuario@empresa.com" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="departamentoUsuario" class="form-label-custom">Departamento</label>
                        <select class="form-select custom-input" id="departamentoUsuario">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="ti">Tecnologia da Informação</option>
                            <option value="rh">Recursos Humanos</option>
                            <option value="financeiro">Financeiro</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="nivelHierarquico" class="form-label-custom">Nível hierárquico *</label>
                        <select class="form-select custom-input" id="nivelHierarquico" required>
                            <option value="" disabled selected>Selecione...</option>
                            <option value="diretoria">Diretoria</option>
                            <option value="gerencia">Gerência</option>
                            <option value="coordenacao">Coordenação</option>
                            <option value="operacional">Operacional</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="permissao" class="form-label-custom">Permissão administrativa *</label>
                        <select class="form-select custom-input" id="permissao" required>
                            <option value="" disabled selected>Selecione...</option>
                            <option value="admin">Administrador</option>
                            <option value="comum">Usuário Comum</option>
                            <option value="leitor">Apenas Leitura</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="cargoUsuario" class="form-label-custom">Cargo *</label>
                        <input type="text" class="form-control custom-input" id="cargoUsuario" required>
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="step-usuarios-hub.html" class="btn btn-outline-secondary btn-pill">voltar</a>
                    <button type="submit" class="btn btn-orange btn-pill text-white fw-bold">próximo</button>
                </div>
            </form>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
