<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - Administrador Principal - Projeto IV</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Fonte Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Arquivos CSS de Referência -->
    <link href="../../../css/base/variables.css" rel="stylesheet">
    <link href="../../../css/base/bootstrap-overrides.css" rel="stylesheet">
    <link href="../../../css/components/onboarding-card.css" rel="stylesheet">
    <link href="../../../css/components/form-fields.css" rel="stylesheet">
    <link href="../../../css/components/buttons.css" rel="stylesheet">
    <link href="../../../css/components/wizard-tabs.css" rel="stylesheet">
    <link href="../../../css/pages/onboarding.css" rel="stylesheet">
</head>

<body class="bg-light auth-bg onboarding-bg">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">

        <div class="onboarding-card p-5 bg-white">
            
            <!-- Menu de Passos (Stepper) -->
            <ul class="wizard-stepper">
                <li class="wizard-step">
                    Tenant
                </li>
                <li class="wizard-step active">
                    Administrador Principal
                </li>
                <li class="wizard-step">
                    Departamentos
                </li>
                <li class="wizard-step">
                    Usuários
                </li>
                <li class="wizard-step">
                    IA
                </li>
                <li class="wizard-step">
                    Revisão
                </li>
            </ul>

            <form id="adminForm" action="step-departamentos-hub.html" method="GET" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nomeCompleto" class="form-label-custom">Nome completo *</label>
                        <input type="text" class="form-control custom-input" id="nomeCompleto" required>
                    </div>
                    <div class="col-md-6">
                        <label for="emailCorporativo" class="form-label-custom">E-mail corporativo *</label>
                        <input type="email" class="form-control custom-input" id="emailCorporativo" placeholder="exemplo@empresa.com" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="cargo" class="form-label-custom">Cargo *</label>
                        <input type="text" class="form-control custom-input" id="cargo" required>
                    </div>
                    <div class="col-md-6">
                        <label for="telefone" class="form-label-custom">Telefone de contato *</label>
                        <input type="tel" class="form-control custom-input" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>

                    <div class="col-md-6">
                        <label for="senha" class="form-label-custom">Senha *</label>
                        <input type="password" class="form-control custom-input" id="senha" required>
                    </div>
                    <div class="col-md-6">
                        <label for="confirmarSenha" class="form-label-custom">Confirmação de senha *</label>
                        <input type="password" class="form-control custom-input" id="confirmarSenha" required>
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="step-tenant.html" class="btn btn-outline-secondary btn-pill">voltar</a>
                    <button type="submit" class="btn btn-orange btn-pill text-white fw-bold">próximo</button>
                </div>
            </form>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
