<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - Configuração de IA - Projeto IV</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Fonte Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Arquivos CSS de Referência -->
    <link href="../../../css/base/variables.css" rel="stylesheet">
    <link href="../../../css/base/bootstrap-overrides.css" rel="stylesheet">
    <link href="../../../css/components/onboarding-card.css" rel="stylesheet">
    <link href="../../../css/components/form-fields.css" rel="stylesheet">
    <link href="../../../css/components/buttons.css" rel="stylesheet">
    <link href="../../../css/components/wizard-tabs.css" rel="stylesheet">
    <link href="../../../css/components/data-grid.css" rel="stylesheet">
    <link href="../../../css/pages/onboarding.css" rel="stylesheet">
</head>

<body class="bg-light auth-bg onboarding-bg">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">

        <div class="onboarding-card p-5 bg-white">
            
            <!-- Menu de Passos (Stepper) -->
            <ul class="wizard-stepper">
                <li class="wizard-step">
                    Tenant
                </li>
                <li class="wizard-step">
                    Administrador Principal
                </li>
                <li class="wizard-step">
                    Departamentos
                </li>
                <li class="wizard-step">
                    Usuários
                </li>
                <li class="wizard-step active">
                    IA
                </li>
                <li class="wizard-step">
                    Revisão
                </li>
            </ul>

            <form id="iaForm" action="step-revisao.html" method="GET" novalidate>
                
                <!-- Credencial do Provedor de IA (BYOK) -->
                <div class="mb-4">
                    <h5 class="fw-semibold text-dark mb-3">Credencial do Provedor de IA (BYOK)</h5>
                    <div class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label for="provedorIa" class="form-label-custom">Provedor de IA</label>
                            <select class="form-select custom-input" id="provedorIa">
                                <option value="" disabled selected>Selecione...</option>
                                <option value="openai">OpenAI</option>
                                <option value="anthropic">Anthropic</option>
                                <option value="google">Google Gemini</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label for="apiKey" class="form-label-custom">Chave de API</label>
                            <input type="password" class="form-control custom-input" id="apiKey" placeholder="sk-...">
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-orange btn-pill w-100 py-2 fw-bold">testar conexão</button>
                        </div>
                        
                        <div class="col-md-10">
                            <label for="nomeCredencial" class="form-label-custom">Nome interno da credencial</label>
                            <input type="text" class="form-control custom-input" id="nomeCredencial" placeholder="Ex: Credencial Produção">
                        </div>
                    </div>
                </div>

                <!-- Catálogo de Modelos -->
                <div class="mb-4">
                    <h5 class="fw-semibold text-dark mb-3">Catálogo de Modelos</h5>
                    <div class="data-grid-container">
                        <table class="data-grid">
                            <thead>
                                <tr>
                                    <th>Nome do modelo</th>
                                    <th>Status</th>
                                    <th>Permissões</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>gpt-4o</td>
                                    <td>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" role="switch" id="model1" checked>
                                            <label class="form-check-label" for="model1">Ativo</label>
                                        </div>
                                    </td>
                                    <td>
                                        <select class="form-select custom-input form-select-sm w-auto">
                                            <option value="todos">Todos</option>
                                            <option value="restrito">Restrito</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td>claude-3-5-sonnet</td>
                                    <td>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" role="switch" id="model2">
                                            <label class="form-check-label" for="model2">Inativo</label>
                                        </div>
                                    </td>
                                    <td>
                                        <select class="form-select custom-input form-select-sm w-auto">
                                            <option value="todos">Todos</option>
                                            <option value="restrito">Restrito</option>
                                        </select>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="step-usuarios-hub.html" class="btn btn-outline-secondary btn-pill">voltar</a>
                    <button type="submit" class="btn btn-orange btn-pill text-white fw-bold">próximo</button>
                </div>
            </form>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
