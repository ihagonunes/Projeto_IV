# Configuração específica dos testes de integração.
# Sobrescreve/augmenta src/main/resources/application.yml no contexto de teste.
# Garante que o Flyway rode como parte da inicialização do DataSource,
# ANTES da validação do schema pelo Hibernate (ddl-auto=validate),
# evitando o erro "Schema validation: missing table [app_user]".

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  ai:
    delivery:
      # Determinístico nos ITs: o job é acionado explicitamente via runOnce().
      enabled: false
      interval-ms: 30000
      max-attempts: 8
      inflight-grace-ms: 90000
  security:
    jwt:
      # Segredo apenas para os testes de integração (>= 32 chars).
      secret: test-secret-0123456789abcdef0123456789
  bootstrap:
    # Não cria dados de demonstração nos testes.
    demo-data: false
