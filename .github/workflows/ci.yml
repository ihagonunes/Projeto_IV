name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  unit-and-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven unit + architecture
        run: mvn -B test

  integration-postgresql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: PostgreSQL integration via Testcontainers
        run: mvn -B verify -Pintegration
